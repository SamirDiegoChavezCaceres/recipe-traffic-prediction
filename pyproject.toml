[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recipe-traffic-prediction"
version = "0.1.0"
description = "Predict high-traffic recipes with an sklearn pipeline that imputes missing data; synthetic dataset."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Samir Chavez" }]
dependencies = ["numpy", "pandas", "scikit-learn>=1.3"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
